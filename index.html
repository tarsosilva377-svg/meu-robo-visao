<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidal Warfare - Fragata Stealth Realista</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#0a1422;width:100vw;height:100vh;overflow:hidden}
  #ui{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(10,20,35,.9);border:1.5px solid #00d2d3;padding:10px 18px;border-radius:12px;color:#fff;font-weight:700;font-size:13px;z-index:10;white-space:nowrap}
  #buttons{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;flex-wrap:wrap;justify-content:center}
  .btn{background:#00d2d3;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:700;cursor:pointer}
  .btn2{background:#1a2a3a;color:#fff;border:1.5px solid #00d2d3;padding:10px 18px;border-radius:20px;font-weight:700;cursor:pointer}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1422;color:#00d2d3;font-weight:700;z-index:20}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">Carregando fragata...</div>
<div id="ui">⚓ FRAGATA STEALTH - TIDAL WARFARE</div>
<div id="buttons">
  <button class="btn" onclick="setView('side')">Lateral</button>
  <button class="btn2" onclick="setView('top')">Topo (Jogo)</button>
  <button class="btn2" onclick="setView('front')">Proa</button>
  <button class="btn2" onclick="setView('orbit')">Orbitar</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a5b8);
scene.fog = new THREE.Fog(0x87a5b8, 60, 140);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(18, 8, 22);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

// LUZES REALISTAS
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
fill.position.set(-20, 10, -20);
scene.add(fill);

// MAR REALISTA
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300, 80, 80),
  new THREE.MeshStandardMaterial({color:0x0a4a6e, roughness:0.15, metalness:0.6})
);
sea.rotation.x = -Math.PI/2;
sea.position.y = -1.8;
sea.receiveShadow = true;
scene.add(sea);

// ===== MATERIAIS =====
const matHull = new THREE.MeshStandardMaterial({color:0x8a8f96, roughness:0.45, metalness:0.55});
const matDeck = new THREE.MeshStandardMaterial({color:0x6b7078, roughness:0.7, metalness:0.3});
const matDark = new THREE.MeshStandardMaterial({color:0x23262b, roughness:0.5, metalness:0.6});
const matBlack = new THREE.MeshStandardMaterial({color:0x0f1113, roughness:0.35, metalness:0.7});
const matGlass = new THREE.MeshStandardMaterial({color:0x0a1a2a, roughness:0.1, metalness:0.9});
const matRed = new THREE.MeshStandardMaterial({color:0xb02a1e, roughness:0.5, metalness:0.2});
const matWhite = new THREE.MeshStandardMaterial({color:0xf0f0f0, roughness:0.6});
const matCopper = new THREE.MeshStandardMaterial({color:0x8a6a3a, roughness:0.4, metalness:0.8});

const ship = new THREE.Group();
scene.add(ship);

function add(mesh, x=0, y=0, z=0){
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  ship.add(mesh);
  return mesh;
}

// 1. CASCO COM CURVA SUAVE - usa Shape + Extrude com bevel suave
const hullShape = new THREE.Shape();
hullShape.moveTo(0, -8);
hullShape.bezierCurveTo(1.8, -7.8, 2.3, -5, 2.2, -2);
hullShape.bezierCurveTo(2.1, 0.5, 1.6, 3, 0.9, 5.5);
hullShape.bezierCurveTo(0.5, 7, 0.15, 8, 0, 8.5);
hullShape.bezierCurveTo(-0.15, 8, -0.5, 7, -0.9, 5.5);
hullShape.bezierCurveTo(-1.6, 3, -2.1, 0.5, -2.2, -2);
hullShape.bezierCurveTo(-2.3, -5, -1.8, -7.8, 0, -8);

const hullGeo = new THREE.ExtrudeGeometry(hullShape, {depth:1.8, bevelEnabled:true, bevelThickness:0.4, bevelSize:0.3, bevelSegments:4, curveSegments:24});
const hull = add(new THREE.Mesh(hullGeo, matHull));
hull.rotation.x = Math.PI/2;
hull.position.y = -0.2;
hull.scale.set(1, 1, 1);

// Linha de flutuação vermelha
const waterline = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.18, 15.5), matRed);
waterline.position.set(0, -1.15, -0.2);
ship.add(waterline);

// 2. CONVÉS COM DETALHE
const deckShape = new THREE.Shape();
deckShape.moveTo(0, -7.4);
deckShape.bezierCurveTo(1.6, -7.2, 2.0, -4, 1.9, -1);
deckShape.bezierCurveTo(1.8, 2, 1.1, 4.5, 0.2, 7.2);
deckShape.lineTo(0, 7.8);
deckShape.lineTo(-0.2, 7.2);
deckShape.bezierCurveTo(-1.1, 4.5, -1.8, 2, -1.9, -1);
deckShape.bezierCurveTo(-2.0, -4, -1.6, -7.2, 0, -7.4);
const deck = add(new THREE.Mesh(new THREE.ExtrudeGeometry(deckShape, {depth:0.2, bevelEnabled:false, curveSegments:24}), matDeck));
deck.rotation.x = -Math.PI/2;
deck.position.y = 0.95;

// 3. SUPERESTRUTURA STEALTH - forma inclinada realista
// Parte principal - perfil lateral inclinado
const superShape = new THREE.Shape();
superShape.moveTo(-4.5, 0);
superShape.lineTo(-4.5, 1.1);
superShape.lineTo(-2.8, 1.9);
superShape.lineTo(0.8, 1.9);
superShape.lineTo(2.8, 0.9);
superShape.lineTo(4.6, 0.9);
superShape.lineTo(4.6, 0);
superShape.closePath();
const superGeo = new THREE.ExtrudeGeometry(superShape, {depth:2.4, bevelEnabled:true, bevelThickness:0.15, bevelSize:0.15, bevelSegments:2});
const superMesh = add(new THREE.Mesh(superGeo, matHull));
superMesh.rotation.y = Math.PI/2;
superMesh.position.set(0, 1.0, -1.2);

// Segunda camada - ponte
const bridgeShape = new THREE.Shape();
bridgeShape.moveTo(-2.2, 0);
bridgeShape.lineTo(-2.2, 1.0);
bridgeShape.lineTo(-0.8, 1.6);
bridgeShape.line
