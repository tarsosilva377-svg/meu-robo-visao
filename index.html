<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robô Assistente - Visão & Voz IA</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #121212; color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center; padding: 8px;
    }
    h2 { font-size: 15px; color: #00ffcc; text-align: center; margin-bottom: 6px; }
    
    #btnStart {
      width: 100%; max-width: 380px; padding: 12px; background-color: #28a745;
      color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold;
      margin-bottom: 6px; cursor: pointer; flex-shrink: 0;
    }
    
    .controls-bar {
      display: flex; gap: 8px; width: 100%; max-width: 380px; margin-bottom: 6px;
    }
    .btn-torch {
      flex: 1; padding: 10px; background-color: #ffc107; color: #000;
      border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .video-box {
      position: relative; width: 100%; max-width: 380px; height: 180px;
      background-color: #000; border-radius: 8px; overflow: hidden;
      border: 1px solid #333; flex-shrink: 0;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #chat-box {
      width: 100%; max-width: 380px; flex: 1; background-color: #1e1e1e;
      border-radius: 8px; margin-top: 6px; padding: 8px; overflow-y: auto;
      border: 1px solid #333; display: flex; flex-direction: column; gap: 6px; margin-bottom: 60px;
    }
    .msg { padding: 8px 10px; border-radius: 6px; font-size: 13px; max-width: 88%; line-height: 1.3; word-wrap: break-word; }
    .msg-user { background-color: #007bff; color: #fff; align-self: flex-end; }
    .msg-ia { background-color: #2a2a2a; color: #00ffcc; align-self: flex-start; border-left: 3px solid #00ffcc; }
    
    .input-box { display: flex; width: 100%; max-width: 380px; position: fixed; bottom: 8px; z-index: 5; }
    .mic-btn {
      width: 100%; padding: 14px; background-color: #dc3545; color: white;
      border: none; border-radius: 8px; font-weight: bold; font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
  </style>
</head>
<body>

  <h2>🤖 Robô Assistente Multimodal</h2>

  <button id="btnStart" onclick="iniciarSistema()">📷 Ligar Câmera, Voz e Lanterna</button>

  <div class="controls-bar" id="controlsBar" style="display:none;">
    <button class="btn-torch" id="btnTorch" onclick="alternarLanterna()">🔦 Alternar Lanterna</button>
  </div>

  <div class="video-box">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="chat-box">
    <div class="msg msg-ia">Olá! Eu sou o seu robô assistente. Clique no botão vermelho e pergunte o que estou vendo ou peça para acender a lanterna!</div>
  </div>

  <div class="input-box">
    <button class="mic-btn" onclick="iniciarReconhecimentoVoz()">🎙️ Pergunta ao Robô</button>
  </div>

  <!-- Canvas oculto para captura de fotos da câmera para a API -->
  <canvas id="snapshotCanvas" style="display:none;"></canvas>

  <script>
    // Cole aqui sua chave de API do Google Gemini (se tiver)
    const GEMINI_API_KEY = "SUA_CHAVE_GEMINI_AQUI";

    const video = document.getElementById('video');
    const chatBox = document.getElementById('chat-box');
    let videoTrack = null;
    let lanternaAtiva = false;

    // 1. SINTETIZADOR DE VOZ (Opção 1: Voz Sem MP3)
    function falar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Cancela falas anteriores
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0; // Velocidade normal
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 2. LIGAR CÂMERA E PREPARAR SUPORTE À LANTERNA
    async function iniciarSistema() {
      const btn = document.getElementById('btnStart');
      btn.innerText = "⏳ Iniciando Câmera...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        video.onloadedmetadata = () => {
          btn.style.display = 'none';
          document.getElementById('controlsBar').style.display = 'flex';
          const msg = "Sistema pronto! Câmera e síntese de voz ativadas.";
          adicionarMsgIA(msg);
          falar(msg);
        };
      } catch (err) {
        console.error("Erro ao acessar a câmera:", err);
        alert("Ative a permissão de câmera no seu dispositivo/app.");
        btn.innerText = "🔄 Tentar Novamente";
      }
    }

    // 3. CONTROLE DA LANTERNA (TORCH)
    async function alternarLanterna(estadoDesejado = null) {
      if (!videoTrack) {
        adicionarMsgIA("Câmera não inicializada.");
        return;
      }

      const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      
      if (!capabilities.torch && !('torch' in capabilities)) {
        console.warn("A API Web Torch pode não ser suportada diretamente neste navegador/hardware.");
      }

      lanternaAtiva = (estadoDesejado !== null) ? estadoDesejado : !lanternaAtiva;

      try {
        await videoTrack.applyConstraints({
          advanced: [{ torch: lanternaAtiva }]
        });
        const status = lanternaAtiva ? "Lanterna acesa!" : "Lanterna apagada.";
        adicionarMsgIA("🔦 " + status);
        falar(status);
      } catch (err) {
        console.error("Erro ao alternar lanterna:", err);
        adicionarMsgIA("Não foi possível alternar a lanterna neste dispositivo.");
        falar("Não consegui controlar a lanterna.");
      }
    }

    // 4. CAPTURAR FRAME ATUAL DA CÂMERA
    function capturarFotoBase64() {
      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      // Retorna em JPEG sem o cabeçalho data:image/jpeg;base64,
      return canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    }

    // 5. ENVIAR PARA A INTELIGÊNCIA ARTIFICIAL (GEMINI API - VISÃO ILIMITADA)
    async function analisarComGemini(perguntaUsuario) {
      if (!GEMINI_API_KEY || GEMINI_API_KEY === "SUA_CHAVE_GEMINI_AQUI") {
        const respostaFallback = "Modo Visão Gemini não configurado com chave de API. Mas posso ver pela câmera local!";
        adicionarMsgIA(respostaFallback);
        falar(respostaFallback);
        return;
      }

      adicionarMsgIA("🤔 Analisando imagem...");
      falar("Analisando imagem...");

      const imageBase64 = capturarFotoBase64();

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      const payload = {
        contents: [{
          parts: [
            { text: "Você é um robô assistente amigável. Responda em português de forma direta e curta (no máximo 2 frases) sobre o que você vê na imagem para responder a esta pergunta: " + perguntaUsuario },
            {
              inline_data: {
                mime_type: "image/jpeg",
                data: imageBase64
              }
            }
          ]
        }]
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const respostaIA = data.candidates[0].content.parts[0].text;
          adicionarMsgIA(respostaIA);
          falar(respostaIA);
        } else {
          throw new Error("Resposta inválida da API");
        }
      } catch (err) {
        console.error("Erro na API do Gemini:", err);
        const erroMsg = "Tive um problema ao analisar a imagem pela IA.";
        adicionarMsgIA(erroMsg);
        falar(erroMsg);
      }
    }

    // 6. RECONHECIMENTO DE VOZ DO USUÁRIO
    function iniciarReconhecimentoVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Reconhecimento de voz não suportado neste navegador.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';

      recognition.onstart = () => { 
        adicionarMsgIA("👂 Ouvindo...");
      };

      recognition.onresult = (event) => {
        const textoFalado = event.results[0][0].transcript.toLowerCase();
        adicionarMsgUser(textoFalado);

        // Comandos de controle da Lanterna
        if (textoFalado.includes("acender lanterna") || textoFalado.includes("ligar lanterna") || textoFalado.includes("liga a luz")) {
          alternarLanterna(true);
        } else if (textoFalado.includes("apagar lanterna") || textoFalado.includes("desligar lanterna") || textoFalado.includes("desliga a luz")) {
          alternarLanterna(false);
        } else {
          // Qualquer outra pergunta é enviada para análise de imagem da IA
          analisarComGemini(textoFalado);
        }
      };

      recognition.start();
    }

    function adicionarMsgUser(texto) {
      const msg = document.createElement('div');
      msg.className = 'msg msg-user';
      msg.innerText = texto;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function adicionarMsgIA(texto) {
      const msg = document.createElement('div');
      msg.className = 'msg msg-ia';
      msg.innerText = texto;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
