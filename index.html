<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robô Assistente - Visão & Voz IA</title>
  
  <!-- Carregamento das bibliotecas locais/tradicionais para o Plano B / Plano C -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #121212; color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center; padding: 8px;
    }
    h2 { font-size: 15px; color: #00ffcc; text-align: center; margin-bottom: 6px; }
    
    #btnStart {
      width: 100%; max-width: 380px; padding: 12px; background-color: #28a745;
      color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold;
      margin-bottom: 6px; cursor: pointer; flex-shrink: 0;
    }
    
    .controls-bar {
      display: flex; gap: 8px; width: 100%; max-width: 380px; margin-bottom: 6px;
    }
    .btn-torch {
      flex: 1; padding: 10px; background-color: #ffc107; color: #000;
      border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .video-box {
      position: relative; width: 100%; max-width: 380px; height: 180px;
      background-color: #000; border-radius: 8px; overflow: hidden;
      border: 1px solid #333; flex-shrink: 0;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #chat-box {
      width: 100%; max-width: 380px; flex: 1; background-color: #1e1e1e;
      border-radius: 8px; margin-top: 6px; padding: 8px; overflow-y: auto;
      border: 1px solid #333; display: flex; flex-direction: column; gap: 6px; margin-bottom: 60px;
    }
    .msg { padding: 8px 10px; border-radius: 6px; font-size: 13px; max-width: 88%; line-height: 1.3; word-wrap: break-word; }
    .msg-user { background-color: #007bff; color: #fff; align-self: flex-end; }
    .msg-ia { background-color: #2a2a2a; color: #00ffcc; align-self: flex-start; border-left: 3px solid #00ffcc; }
    
    .input-box { display: flex; width: 100%; max-width: 380px; position: fixed; bottom: 8px; z-index: 5; }
    .mic-btn {
      width: 100%; padding: 14px; background-color: #dc3545; color: white;
      border: none; border-radius: 8px; font-weight: bold; font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
  </style>
</head>
<body>

  <h2>🤖 Robô Assistente (Plano A / B / C)</h2>

  <button id="btnStart" onclick="iniciarSistema()">📷 Ligar Câmera, Voz e Lanterna</button>

  <div class="controls-bar" id="controlsBar" style="display:none;">
    <button class="btn-torch" id="btnTorch" onclick="alternarLanterna()">🔦 Alternar Lanterna</button>
  </div>

  <div class="video-box">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="chat-box">
    <div class="msg msg-ia">Modo padrão ativado (Plano C: Identificação tradicional). Peça "analisar com inteligência artificial" para usar o modo IA!</div>
  </div>

  <div class="input-box">
    <button class="mic-btn" onclick="iniciarReconhecimentoVoz()">🎙️ Falar com Assistente</button>
  </div>

  <canvas id="snapshotCanvas" style="display:none;"></canvas>

  <script>
    // CHAVE DO OPENROUTER
    const OPENROUTER_API_KEY = "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";

    const video = document.getElementById('video');
    const chatBox = document.getElementById('chat-box');
    let videoTrack = null;
    let lanternaAtiva = false;
    let modeloLocalCOCO = null;

    // Tradução básica de objetos comuns para português no Plano B / C
    const tradutorObjetos = {
      "person": "pessoa", "cell phone": "celular", "laptop": "notebook",
      "mouse": "mouse", "keyboard": "teclado", "cup": "xícara ou copo",
      "bottle": "garrafa", "chair": "cadeira", "book": "livro",
      "tv": "televisão", "dog": "cachorro", "cat": "gato"
    };

    // 1. SINTETIZADOR DE VOZ
    function falar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 2. LIGAR CÂMERA E CARREGAR PLANO C (DETECÇÃO LOCAL)
    async function iniciarSistema() {
      const btn = document.getElementById('btnStart');
      btn.innerText = "⏳ Carregando Câmera e Modelo Local...";

      // Inicializa modelo local COCO-SSD para o Plano C / B
      try {
        modeloLocalCOCO = await cocoSsd.load();
      } catch (e) {
        console.warn("Não foi possível carregar modelo local adiantado.", e);
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        video.onloadedmetadata = async () => {
          btn.style.display = 'none';
          document.getElementById('controlsBar').style.display = 'flex';
          
          await alternarLanterna(true);

          const msg = "Sistema pronto no Plano C (visão local). Diga 'analisar com IA' quando desejar a análise avançada!";
          adicionarMsgIA(msg);
          falar(msg);
        };
      } catch (err) {
        console.error("Erro ao acessar a câmera:", err);
        alert("Ative a permissão de câmera no seu dispositivo.");
        btn.innerText = "🔄 Tentar Novamente";
      }
    }

    // 3. CONTROLE DA LANTERNA
    async function alternarLanterna(estadoDesejado = null) {
      if (!videoTrack) return;
      lanternaAtiva = (estadoDesejado !== null) ? estadoDesejado : !lanternaAtiva;
      try {
        await videoTrack.applyConstraints({
          advanced: [{ torch: lanternaAtiva }]
        });
        adicionarMsgIA("🔦 " + (lanternaAtiva ? "Lanterna acesa!" : "Lanterna apagada."));
      } catch (err) {
        console.warn("Controle de lanterna indisponível:", err);
      }
    }

    // 4. CAPTURAR FRAME DA CÂMERA
    function capturarFotoBase64() {
      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    }

    // 5. PLANO B e C: ANÁLISE TRADICIONAL LOCAL DE OBJETOS
    async function executarAnaliseLocalPlanoB(motivoTrigger) {
      adicionarMsgIA(`🔄 Executando análise de visão tradicional (Plano B/C)...`);
      falar("Analisando objetos na imagem...");

      try {
        if (!modeloLocalCOCO) {
          modeloLocalCOCO = await cocoSsd.load();
        }

        const predicoes = await modeloLocalCOCO.detect(video);
        
        if (predicoes && predicoes.length > 0) {
          const objetosEncontrados = predicoes.map(p => {
            const nomePt = tradutorObjetos[p.class] || p.class;
            return `${nomePt} (${Math.round(p.score * 100)}% de certeza)`;
          });

          const resultado = "Objetos identificados localmente: " + objetosEncontrados.join(", ") + ".";
          adicionarMsgIA(resultado);
          falar(resultado);
        } else {
          const semObjeto = "Análise tradicional concluída: Nenhum objeto principal foi identificado claramente.";
          adicionarMsgIA(semObjeto);
          falar(semObjeto);
        }
      } catch (err) {
        console.error("Erro no Plano B/C local:", err);
        const erroLocal = "Não foi possível identificar objetos na imagem localmente.";
        adicionarMsgIA(erroLocal);
        falar(erroLocal);
      }
    }

    // 6. PLANO A: ANÁLISE DE IA COM FALLBACK AUTOMÁTICO PARA O PLANO B
    async function analisarComIA(perguntaUsuario) {
      if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY.includes("SUA_CHAVE")) {
        adicionarMsgIA("⚠️ Chave de IA não configurada. Redirecionando para análise tradicional...");
        await executarAnaliseLocalPlanoB("Sem chave");
        return;
      }

      adicionarMsgIA("🤖 [Plano A] Enviando imagem para Inteligência Artificial...");
      falar("Enviando para inteligência artificial...");

      const imageBase64 = capturarFotoBase64();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY.trim()}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "Meu Robo Visao"
          },
          body: JSON.stringify({
            "model": "meta-llama/llama-3.2-11b-vision-instruct:free",
            "messages": [
              {
                "role": "user",
                "content": [
                  {
                    "type": "text",
                    "text": "Você é um robô assistente. Responda em português de forma direta e curta (no máximo 2 frases) sobre o que vê na imagem para responder a: " + perguntaUsuario
                  },
                  {
                    "type": "image_url",
                    "image_url": {
                      "url": `data:image/jpeg;base64,${imageBase64}`
                    }
                  }
                ]
              }
            ]
          })
        });

        const data = await response.json();

        if (data.error || !data.choices || !data.choices[0] || !data.choices[0].message.content) {
          throw new Error(data.error ? data.error.message : "Resposta inválida da API de IA");
        }

        const respostaIA = data.choices[0].message.content;
        adicionarMsgIA("🤖 IA: " + respostaIA);
        falar(respostaIA);

      } catch (err) {
        console.warn("Falha no Plano A (IA). Ativando Plano B automaticamente...", err);
        adicionarMsgIA("⚠️ Falha ao conectar com a IA. Ativando Plano B (Análise Tradicional)...");
        await executarAnaliseLocalPlanoB("Falha na API");
      }
    }

    // 7. RECONHECIMENTO DE VOZ
    function iniciarReconhecimentoVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Reconhecimento de voz não suportado neste navegador.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';

      recognition.onstart = () => { 
        adicionarMsgIA("👂 Ouvindo...");
      };

      recognition.onresult = (event) => {
        const textoFalado = event.results[0][0].transcript.toLowerCase();
        adicionarMsgUser(textoFalado);

        // Comandos de Lanterna
        if (textoFalado.includes("acender lanterna") || textoFalado.includes("ligar lanterna") || textoFalado.includes("liga a luz")) {
          alternarLanterna(true);
          falar("Acendendo a lanterna.");
        } 
        else if (textoFalado.includes("apagar lanterna") || textoFalado.includes("desligar lanterna") || textoFalado.includes("desliga a luz")) {
          alternarLanterna(false);
          falar("Apagando a lanterna.");
        } 
        // Chama a IA (Plano A com Fallback para Plano B) se solicitado explicitamente
        else if (
          textoFalado.includes("inteligência artificial") || 
          textoFalado.includes("analisar com ia") || 
          textoFalado.includes("usar ia") ||
          textoFalado.includes("modo ia")
        ) {
          analisarComIA(textoFalado);
        }
        // Caso contrário, opera no Plano C (Análise Local)
        else {
          executarAnaliseLocalPlanoB("Solicitação Padrão Plano C");
        }
      };

      recognition.start();
    }

    function adicionarMsgUser(texto) {
      const msg = document.createElement('div');
      msg.className = 'msg msg-user';
      msg.innerText = texto;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function adicionarMsgIA(texto) {
      const msg = document.createElement('div');
      msg.className = 'msg msg-ia';
      msg.innerText = texto;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
